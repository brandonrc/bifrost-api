# openapi-generator config for the TypeScript SDK (typescript-fetch: no
# runtime deps, browser + node). The generator emits package.json/src/etc.;
# we commit only this config + any templates/ overrides. Version is
# overridden per-run in CI.
generatorName: typescript-fetch
additionalProperties:
  npmName: "@brandonrc/bifrost-client"
  npmVersion: "0.1.0"
  npmRepository: "https://npm.pkg.github.com"
  supportsES6: true
  withInterfaces: true
