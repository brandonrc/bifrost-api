name: Generate & publish SDKs

# Generates the SDKs from openapi.json with openapi-generator (Mustache
# templates; per-language config under sdk/<lang>/config.yaml, overrides in
# sdk/<lang>/templates/) and publishes them. Nothing generated is committed.
# Dev versioning: 0.1.<run_number>.
#
# Publish steps are secret-gated. A missing secret is a hard failure (exit 1)
# on a main-branch push — silent skips are a defect (SPEC.md). Pushing to a
# branch other than main (or workflow_dispatch off main) still builds without
# publishing, since secrets are commonly unavailable outside main-branch CI.
on:
  push:
    branches: [main]
    paths:
      - "openapi.json"
      - "sdk/**"
      - ".github/workflows/generate.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  OPENAPI_GENERATOR_VERSION: v7.12.0

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://npm.pkg.github.com"
          scope: "@brandonrc"
      - name: Generate TS SDK
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/local" \
            openapitools/openapi-generator-cli:${OPENAPI_GENERATOR_VERSION} generate --skip-validate-spec \
            -i /local/openapi.json -g typescript-fetch \
            -c /local/sdk/typescript/config.yaml \
            -t /local/sdk/typescript/templates \
            -o /local/build/typescript \
            --additional-properties=npmVersion=0.1.${GITHUB_RUN_NUMBER}
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: build/typescript
          format: cyclonedx-json
          output-file: sbom-typescript-cyclonedx.json
      - name: Publish to GitHub Packages
        working-directory: build/typescript
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN not available — cannot publish @brandonrc/bifrost-client from a main-branch push." >&2
            exit 1
          fi
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "::notice::NODE_AUTH_TOKEN not set (non-main run) — built but not published."
            exit 0
          fi
          npm install --no-audit --no-fund
          npm publish

  python:
    # Publishes to a GitHub Release (asset), not PyPI: GitHub Packages has
    # no native pip-compatible registry, and PYPI_API_TOKEN is
    # unprovisioned. A GitHub Release asset needs only the ambient
    # GITHUB_TOKEN, mirroring the GITHUB_TOKEN-only auth the TypeScript job
    # already uses for GitHub Packages npm. See README.md "SDK packages"
    # for the consumer `pip install <wheel URL>` line.
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate Python SDK
        run: |
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD:/local" \
            openapitools/openapi-generator-cli:${OPENAPI_GENERATOR_VERSION} generate --skip-validate-spec \
            -i /local/openapi.json -g python \
            -c /local/sdk/python/config.yaml \
            -t /local/sdk/python/templates \
            -o /local/build/python \
            --additional-properties=packageVersion=0.1.${GITHUB_RUN_NUMBER}
      - name: Build wheel (validate)
        working-directory: build/python
        run: |
          pip install --quiet build
          python -m build
      - name: SBOM (CycloneDX)
        uses: anchore/sbom-action@v0
        with:
          path: build/python
          format: cyclonedx-json
          output-file: sbom-python-cyclonedx.json
      - name: Publish to GitHub Releases
        working-directory: build/python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ] && [ -z "$GH_TOKEN" ]; then
            echo "::error::GITHUB_TOKEN not available — cannot publish bifrost_client from a main-branch push." >&2
            exit 1
          fi
          if [ -z "$GH_TOKEN" ]; then
            echo "::notice::GH_TOKEN not set (non-main run) — built but not published."
            exit 0
          fi
          VERSION="0.1.${GITHUB_RUN_NUMBER}"
          TAG="python-v${VERSION}"
          gh release create "$TAG" dist/*.whl dist/*.tar.gz \
            --repo "${{ github.repository }}" \
            --title "bifrost_client ${VERSION}" \
            --notes "Python client SDK generated from openapi.json at ${{ github.sha }}."
